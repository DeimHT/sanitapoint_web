{% extends "base.html" %}
{% block title %}Caja – SanitaPoint{% endblock %}
{% block content %}
<div class="card">
  <h2 id="estado_caja">Cargando…</h2>
  <div class="row">
    <button class="btn btn-verde" id="btn_abrir">🔓 Abrir caja</button>
    <button class="btn btn-rojo" id="btn_cerrar">🔒 Cerrar caja</button>
    <button class="btn btn-amber" id="btn_retiro">💸 Retiro</button>
  </div>
</div>

<div class="card" id="cuadre_turno" hidden></div>

<div class="card">
  <h3>Resumen de hoy</h3>
  <div id="resumen_hoy">—</div>
</div>

<div class="card">
  <h3>Movimientos del turno</h3>
  <table>
    <thead><tr><th>Tipo</th><th>Monto</th><th>Descripción</th><th>Fecha/hora</th></tr></thead>
    <tbody id="tabla_movs"><tr><td colspan="4">Sin caja abierta</td></tr></tbody>
  </table>
</div>

<div id="modal" class="modal-backdrop hidden">
  <div class="modal" id="modal_body"></div>
</div>

<script>
let cajaActual = null;

function cerrarModal() { document.getElementById("modal").classList.add("hidden"); }
function abrirModal(html) {
  document.getElementById("modal_body").innerHTML = html;
  document.getElementById("modal").classList.remove("hidden");
}

async function cargarEstado() {
  cajaActual = await api.get("/api/caja");
  const est = document.getElementById("estado_caja");
  const btnAbrir = document.getElementById("btn_abrir");
  const btnCerrar = document.getElementById("btn_cerrar");
  const btnRetiro = document.getElementById("btn_retiro");
  if (cajaActual) {
    document.getElementById("cuadre_turno").innerHTML = renderCuadre(cajaActual);
    document.getElementById("cuadre_turno").hidden = false;
    est.textContent = `🟢 Caja abierta | Operador: ${cajaActual.operador} | Apertura: ${new Date(cajaActual.fecha_apertura).toLocaleString("es-CL")} | Caja inicial: ${fmtMonto(cajaActual.saldo_inicial)} | Torniquete Baño Inicial: ${cajaActual.torniquete_bano_inicial ?? "—"}${cajaActual.servicio === "Ba\u00f1o 2" ? "" : ` | Torniquete Ducha Inicial: ${cajaActual.torniquete_ducha_inicial ?? "—"}`}`;
    btnAbrir.disabled = true; btnCerrar.disabled = false; btnRetiro.disabled = false;
    cargarMovimientos(cajaActual.id);
  } else {
    const ultimo = await api.get("/api/caja/ultimo-cierre");
    const cuadre = document.getElementById("cuadre_turno");
    cuadre.hidden = !ultimo;
    cuadre.innerHTML = ultimo ? `<h2>Último cierre · Caja #${ultimo.id}</h2>${renderCuadre(ultimo)}` : "";
    est.innerHTML = "🔴 Caja cerrada";
    btnAbrir.disabled = false; btnCerrar.disabled = true; btnRetiro.disabled = true;
    document.getElementById("tabla_movs").innerHTML = '<tr><td colspan="4">Sin caja abierta</td></tr>';
  }
  const r = await api.get("/api/caja/resumen/hoy");
  document.getElementById("resumen_hoy").innerHTML =
    `Ventas: ${r.total_transacciones} &nbsp;|&nbsp; Total: ${fmtMonto(r.total_monto)} ` +
    `&nbsp;|&nbsp; Efectivo: ${fmtMonto(r.efectivo)} &nbsp;|&nbsp; Tarjetas: ${fmtMonto(r.tarjetas)} ` +
    (r.transferencia ? `&nbsp;|&nbsp; Transferencias anteriores: ${fmtMonto(r.transferencia)} ` : "") +
    `&nbsp;|&nbsp; Pases gratis: ${r.pases_gratis}`;
  aplicarPermisos();
}

function aplicarPermisos() {
  // Oculta las acciones que el rol no puede realizar (además del estado de caja).
  if (typeof puede !== "function" || !cuentaActual) return;
  document.getElementById("btn_abrir").hidden = !puede("caja_apertura");
  document.getElementById("btn_cerrar").hidden = !puede("caja_cierre");
  document.getElementById("btn_retiro").hidden = !puede("caja_retiro");
  if (puede("caja_retiro")) document.getElementById("btn_retiro").disabled = false;
}
document.addEventListener("cuenta-lista", aplicarPermisos);

async function cargarMovimientos(cajaId) {
  const movs = await api.get(`/api/caja/${cajaId}/movimientos`);
  const tbody = document.getElementById("tabla_movs");
  tbody.innerHTML = "";
  if (!movs.length) { tbody.innerHTML = '<tr><td colspan="4">Sin movimientos</td></tr>'; return; }
  movs.forEach((m) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${m.tipo}</td><td>${fmtMonto(m.monto)}</td><td>${m.descripcion || ""}</td>
      <td>${new Date(m.creado_en).toLocaleString("es-CL")}</td>`;
    tbody.appendChild(tr);
  });
}

document.getElementById("btn_abrir").onclick = async () => {
  let cuenta;
  try { cuenta = await api.get("/api/auth/me"); } catch (e) { alert(e.message); return; }
  const tieneDuchas = cuenta.servicio !== "Ba\u00f1o 2";
  abrirModal(`
    <h3>Abrir caja</h3>
    <form id="form_apertura">
    <div class="row"><div style="flex:1"><label for="in_saldo">Caja Inicial</label>
      <input id="in_saldo" type="number" min="0" step="1" required>
      <div style="font-size:12px;color:var(--gris);margin-top:4px">Dinero disponible en la caja al abrir, en pesos.</div>
    </div></div>
    <div class="row"><div style="flex:1"><label for="in_bano">Torniquete Baño Inicial</label>
      <input id="in_bano" type="number" min="0" step="1" required>
      <div style="font-size:12px;color:var(--gris);margin-top:4px">Número indicado en el torniquete de baño al iniciar el turno.</div>
    </div></div>
    ${tieneDuchas ? `<div class="row"><div style="flex:1"><label for="in_ducha">Torniquete Ducha Inicial</label>
      <input id="in_ducha" type="number" min="0" step="1" required>
      <div style="font-size:12px;color:var(--gris);margin-top:4px">Número indicado en el torniquete de ducha al iniciar el turno.</div>
    </div></div>` : ""}
    <div class="row gap-top">
      <button class="btn btn-verde" id="ok" type="submit">Abrir</button>
      <button class="btn btn-gris" type="button" onclick="cerrarModal()">Cancelar</button>
    </div></form>`);
  document.getElementById("form_apertura").onsubmit = async (event) => {
    event.preventDefault();
    const boton = document.getElementById("ok");
    boton.disabled = true;
    try {
      await api.post("/api/caja/abrir", {
        saldo_inicial: Number(document.getElementById("in_saldo").value),
        torniquete_bano_inicial: Number(document.getElementById("in_bano").value),
        torniquete_ducha_inicial: tieneDuchas ? Number(document.getElementById("in_ducha").value) : null,
      });
      cerrarModal(); cargarEstado(); refrescarStatusbar();
    } catch (e) { alert(e.message); }
    finally { boton.disabled = false; }
  };
};

document.getElementById("btn_cerrar").onclick = async () => {
  try { cajaActual = await api.get("/api/caja"); }
  catch (e) { alert(e.message); return; }
  if (!cajaActual) { cargarEstado(); return; }
  const tieneDuchas = cajaActual.servicio !== "Ba\u00f1o 2";
  abrirModal(`
    <h3>Cerrar caja</h3>
    <p>Efectivo esperado: ${fmtMonto(cajaActual.saldo_esperado)} (inicial + ventas en efectivo − retiros).</p>
    <p>Contadores internos: Baño ${cajaActual.contador_bano}${tieneDuchas ? ` · Ducha ${cajaActual.contador_ducha}` : ""}.</p>
    <form id="form_cierre">
    <div class="row"><div style="flex:1"><label for="in_saldo">Caja Final</label>
      <input id="in_saldo" type="number" min="0" step="1" required>
      <p>Dinero contado en la caja al terminar el turno.</p>
    </div></div>
    <div class="row"><div style="flex:1"><label for="in_bano_final">Torniquete Baño Final</label>
      <input id="in_bano_final" type="number" min="${cajaActual.torniquete_bano_inicial ?? 0}" step="1" required>
      <p>Lectura inicial: ${cajaActual.torniquete_bano_inicial ?? "No registrada"}.</p>
    </div></div>
    ${tieneDuchas ? `<div class="row"><div style="flex:1"><label for="in_ducha_final">Torniquete Ducha Final</label>
      <input id="in_ducha_final" type="number" min="${cajaActual.torniquete_ducha_inicial ?? 0}" step="1" required>
      <p>Lectura inicial: ${cajaActual.torniquete_ducha_inicial ?? "No registrada"}.</p>
    </div></div>` : ""}
    <div class="row gap-top">
      <button class="btn btn-rojo" id="ok" type="submit">Cerrar</button>
      <button class="btn btn-gris" type="button" onclick="cerrarModal()">Cancelar</button>
    </div></form>`);
  document.getElementById("form_cierre").onsubmit = async (event) => {
    event.preventDefault();
    const boton = document.getElementById("ok");
    boton.disabled = true;
    try {
      await api.post("/api/caja/cerrar", {
        saldo_final: Number(document.getElementById("in_saldo").value),
        torniquete_bano_final: Number(document.getElementById("in_bano_final").value),
        torniquete_ducha_final: tieneDuchas ? Number(document.getElementById("in_ducha_final").value) : null,
      });
      cerrarModal(); cargarEstado(); refrescarStatusbar();
    } catch (e) { alert(e.message); }
    finally { boton.disabled = false; }
  };
};

document.getElementById("btn_retiro").onclick = async () => {
  let cajas;
  try { cajas = await api.get("/api/caja/abiertas"); }
  catch (e) { alert(e.message); return; }
  if (!cajas.length) { alert("No hay cajas abiertas para retirar dinero."); return; }
  abrirModal(`
    <h3>Retiro de caja</h3>
    <form id="form_retiro">
    <div class="row"><div style="flex:1"><label for="in_caja">Caja del usuario</label><select id="in_caja" required></select></div></div>
    <div class="row"><div style="flex:1"><label for="in_monto">Monto</label><input id="in_monto" type="number" min="1" step="1" required></div></div>
    <div class="row"><div style="flex:1"><label>Motivo</label><input id="in_desc"></div></div>
    <div class="row gap-top">
      <button class="btn btn-amber" id="ok" type="submit">Retirar</button>
      <button class="btn btn-gris" type="button" onclick="cerrarModal()">Cancelar</button>
    </div></form>`);
  const selector = document.getElementById("in_caja");
  selector.add(new Option("Selecciona la caja para el retiro", ""));
  cajas.forEach((c) => selector.add(new Option(`#${c.id} · ${c.operador}`, c.id)));
  document.getElementById("form_retiro").onsubmit = async (event) => {
    event.preventDefault();
    const boton = document.getElementById("ok");
    boton.disabled = true;
    try {
      await api.post("/api/caja/movimiento", {
        tipo: "retiro",
        caja_id: Number(selector.value),
        monto: Number(document.getElementById("in_monto").value || 0),
        descripcion: document.getElementById("in_desc").value.trim() || "Retiro",
      });
      cerrarModal(); cargarEstado();
    } catch (e) { alert(e.message); }
    finally { boton.disabled = false; }
  };
};

cargarEstado();
</script>
{% endblock %}
