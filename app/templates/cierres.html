{% extends "base.html" %}
{% block title %}Cierres – SanitaPoint{% endblock %}
{% block content %}
<div class="card">
  <h2 style="margin:0">Cierres de caja</h2>
  <p style="color:var(--gris);font-size:13px;margin-top:8px">
    Historial de turnos cerrados, con Nro de aperturas/torniquete y totales.
  </p>
</div>

<div class="card">
  <table>
    <thead>
      <tr>
        <th>#</th><th>Operador</th><th>Apertura</th><th>Cierre</th>
        <th>Nro aper.</th><th>Nro cierre</th>
        <th>Saldo inicial</th><th>Saldo final</th>
        <th>Ventas</th><th>Retiros</th>
      </tr>
    </thead>
    <tbody id="tabla"><tr><td colspan="10">Cargando…</td></tr></tbody>
  </table>
</div>

<script>
async function cargar() {
  const cierres = await api.get("/api/caja/cierres");
  const tbody = document.getElementById("tabla");
  tbody.innerHTML = "";
  if (!cierres.length) { tbody.innerHTML = '<tr><td colspan="10">Sin cierres registrados</td></tr>'; return; }
  cierres.forEach((c) => {
    const tr = document.createElement("tr");
    tr.innerHTML =
      `<td>${c.id}</td><td>${c.operador || ""}</td>` +
      `<td>${c.fecha_apertura ? new Date(c.fecha_apertura).toLocaleString("es-CL") : "—"}</td>` +
      `<td>${c.fecha_cierre ? new Date(c.fecha_cierre).toLocaleString("es-CL") : "—"}</td>` +
      `<td>${c.nro_apertura ?? "—"}</td><td>${c.nro_cierre ?? "—"}</td>` +
      `<td>${fmtMonto(c.saldo_inicial)}</td><td>${fmtMonto(c.saldo_final)}</td>` +
      `<td>${fmtMonto(c.total_ventas)} <span style="color:var(--gris)">(${c.n_ventas})</span></td>` +
      `<td>${fmtMonto(c.total_retiros)}</td>`;
    tbody.appendChild(tr);
  });
}
cargar();
</script>
{% endblock %}
