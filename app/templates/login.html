<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar – SanitaPoint</title>
  <link rel="stylesheet" href="/static/css/style.css?v=2">
  <style>
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { background: var(--card); border-radius: 12px; padding: 28px;
                  width: 92%; max-width: 360px; box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
    .login-card h1 { margin: 0 0 4px; font-size: 22px; }
    .login-card p.sub { margin: 0 0 20px; color: var(--gris); font-size: 13px; }
    .login-card label { display: block; margin-bottom: 4px; }
    .login-card input { width: 100%; margin-bottom: 14px; }
    .login-card .btn { width: 100%; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>🚿 SanitaPoint</h1>
      <p class="sub">Ingresa con tu usuario y contraseña</p>
      <label>Usuario</label>
      <input id="username" autofocus autocomplete="username">
      <label>Contraseña</label>
      <input id="password" type="password" autocomplete="current-password">
      <button class="btn btn-verde" id="btn_login">Ingresar</button>
      <div id="error" class="banner error" style="margin-top:14px" hidden></div>
    </div>
  </div>

  <script>
    const err = document.getElementById("error");
    function mostrarError(msg) { err.textContent = msg; err.hidden = false; }

    async function login() {
      err.hidden = true;
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      if (!username || !password) { mostrarError("Ingresa usuario y contraseña."); return; }
      try {
        const r = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });
        if (!r.ok) {
          let detail = "No se pudo ingresar.";
          try { detail = (await r.json()).detail || detail; } catch (e) {}
          mostrarError(detail);
          return;
        }
        window.location = "/";
      } catch (e) {
        mostrarError("Sin conexión con el servidor.");
      }
    }

    document.getElementById("btn_login").addEventListener("click", login);
    document.getElementById("password").addEventListener("keydown", (e) => {
      if (e.key === "Enter") login();
    });
    document.getElementById("username").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("password").focus();
    });
  </script>
</body>
</html>
